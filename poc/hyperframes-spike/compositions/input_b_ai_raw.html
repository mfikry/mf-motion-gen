<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Raw AI Generated Motion Graphic</title>
  <style>
    body {
      margin: 0;
      background: #0f172a;
      color: #38bdf8;
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    .card {
      padding: 40px;
      border: 2px solid #38bdf8;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.4);
    }
    .counter {
      font-size: 80px;
      font-weight: bold;
    }
  </style>
  <script src="../assets/gsap.min.js"></script>
</head>
<body>
  <!-- Raw AI output: no data-composition-id, no data-duration, no window.__timelines -->
  <div class="card">
    <h1>AI GENERATED STREAM</h1>
    <div id="counter" class="counter">0%</div>
  </div>

  <script>
    // AI creates normal auto-playing or generic timeline without HyperFrames registry
    const myTimeline = gsap.timeline({ repeat: -1 });
    myTimeline.to("#counter", {
      innerText: 100,
      snap: { innerText: 1 },
      duration: 5,
      ease: "power1.inOut"
    });
  </script>
</body>
</html>
