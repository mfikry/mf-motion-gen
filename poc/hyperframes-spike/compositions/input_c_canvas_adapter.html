<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Canvas renderFrame Adapter Harness</title>
  <script src="../assets/gsap.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1920px;
      height: 1080px;
      background: #000;
      overflow: hidden;
    }
    #canvasRoot {
      width: 1920px;
      height: 1080px;
      display: block;
    }
  </style>
</head>
<body>
  <!-- HyperFrames contract container -->
  <div
    id="root"
    data-composition-id="main"
    data-start="0"
    data-duration="8"
    data-width="1920"
    data-height="1080"
    data-fps="30"
  >
    <canvas id="motionCanvas" class="clip" data-start="0" data-duration="8" width="1920" height="1080"></canvas>
  </div>

  <!-- User Canvas Function -->
  <script>
    /**
     * Standard Candidate Signature:
     * function renderFrame(ctx, time, frame, totalFrames, config)
     */
    function renderFrame(ctx, time, frame, totalFrames, config) {
      const { width, height } = config;
      // Clear
      ctx.fillStyle = "#070b19";
      ctx.fillRect(0, 0, width, height);

      // Draw background grid
      ctx.strokeStyle = "rgba(0, 240, 255, 0.08)";
      ctx.lineWidth = 1;
      const gridSize = 60;
      for (let x = 0; x < width; x += gridSize) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, height);
        ctx.stroke();
      }
      for (let y = 0; y < height; y += gridSize) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(width, y);
        ctx.stroke();
      }

      // Draw Rotating Dial Gauge
      const cx = width / 2;
      const cy = height / 2;
      const radius = 220;
      const progress = frame / totalFrames;

      // Outer track
      ctx.beginPath();
      ctx.arc(cx, cy, radius, 0, Math.PI * 2);
      ctx.strokeStyle = "rgba(255, 255, 255, 0.1)";
      ctx.lineWidth = 16;
      ctx.stroke();

      // Progress arc
      ctx.beginPath();
      ctx.arc(cx, cy, radius, -Math.PI / 2, -Math.PI / 2 + (Math.PI * 2 * progress));
      ctx.strokeStyle = progress > 0.6 ? "#ff2a5f" : "#00f0ff";
      ctx.lineWidth = 16;
      ctx.lineCap = "round";
      ctx.stroke();

      // Central Text
      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 64px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(`${Math.round(progress * 100)}%`, cx, cy - 20);

      ctx.fillStyle = "#64748b";
      ctx.font = "24px monospace";
      ctx.fillText(`FRAME: ${frame} / ${totalFrames}`, cx, cy + 50);
      ctx.fillText(`TIME: ${time.toFixed(2)}s`, cx, cy + 90);
    }
  </script>

  <!-- Adapter Bridge: Binds renderFrame to GSAP timeline for HyperFrames -->
  <script>
    window.__timelines = window.__timelines || {};

    const canvas = document.getElementById("motionCanvas");
    const ctx = canvas.getContext("2d");
    const totalFrames = 240;
    const config = { width: 1920, height: 1080, fps: 30 };

    const tl = gsap.timeline({ paused: true });
    window.__timelines["main"] = tl;

    const clock = { frame: 0 };
    tl.to(clock, {
      frame: totalFrames,
      duration: 8,
      ease: "none",
      onUpdate: () => {
        const curFrame = Math.round(clock.frame);
        const curTime = clock.frame / 30;
        renderFrame(ctx, curTime, curFrame, totalFrames, config);
      }
    });

    // Render initial frame 0
    renderFrame(ctx, 0, 0, totalFrames, config);
    tl.seek(0);
  </script>
</body>
</html>
