<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'none'; frame-src 'none'; object-src 'none';"
  />
  <title>MF Motion Gen 2.0 — Secure Preview Studio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #0b0f19;
      color: #e2e8f0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      height: 56px;
      padding: 0 16px;
      border-bottom: 1px solid #1e293b;
      background: #111827;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .brand { font-weight: 700; font-size: 15px; letter-spacing: 0.02em; color: #38bdf8; }
    .toolbar { display: flex; align-items: center; gap: 8px; }
    button, select {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 13px;
      cursor: pointer;
    }
    button.primary { background: #0284c7; border-color: #0ea5e9; font-weight: 600; }
    button.danger { background: #991b1b; border-color: #ef4444; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    main {
      flex: 1;
      display: grid;
      grid-template-columns: 320px 1fr;
      overflow: hidden;
    }
    aside {
      border-right: 1px solid #1e293b;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow-y: auto;
      background: #0f172a;
    }
    .panel {
      background: #111827;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 12px;
    }
    .panel h3 {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #94a3b8;
      margin-bottom: 8px;
    }
    .meta-row { display: flex; justify-content: space-between; margin-bottom: 4px; gap: 8px; }
    .mono { font-family: Consolas, monospace; font-size: 11px; word-break: break-all; }
    input[type="range"] { width: 100%; margin: 6px 0; }
    textarea {
      width: 100%;
      height: 110px;
      background: #020617;
      color: #cbd5e1;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 8px;
      font-family: Consolas, monospace;
      font-size: 11px;
      resize: vertical;
    }
    #viewportHost {
      margin: 16px;
      border: 1px dashed #334155;
      border-radius: 8px;
      background: #020617;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #64748b;
      font-size: 13px;
    }
    .log-list {
      max-height: 120px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .badge-ok { color: #4ade80; font-weight: 600; }
    .badge-err { color: #f87171; font-weight: 600; }
  </style>
</head>
<body>
  <header>
    <div class="brand">MF Motion Gen 2.0 — Secure Preview</div>
    <div class="toolbar">
      <button id="btnOpenHtml">Open HTML...</button>
      <select id="selFormat">
        <option value="mp4">MP4 (H.264)</option>
        <option value="mov">MOV (ProRes 4444)</option>
      </select>
      <select id="selQuality">
        <option value="draft">Draft</option>
        <option value="standard">Standard</option>
        <option value="high">High</option>
      </select>
      <button id="btnRender" class="primary" disabled>Render Export</button>
      <button id="btnCancelRender" class="danger" disabled>Cancel</button>
    </div>
  </header>
  <main>
    <aside>
      <div class="panel">
        <h3>Paste Composition HTML</h3>
        <textarea id="txtPasteHtml" placeholder="Paste offline HTML composition..."></textarea>
        <div style="margin-top:6px;display:flex;justify-content:flex-end;">
          <button id="btnLoadPaste">Load Pasted HTML</button>
        </div>
      </div>

      <div class="panel">
        <h3>Session & Preflight</h3>
        <div class="meta-row"><span>Status</span><span id="lblStatus">No composition loaded</span></div>
        <div class="meta-row"><span>Origin</span><span id="lblOrigin" class="mono">-</span></div>
        <div class="meta-row"><span>Spec</span><span id="lblSpec">-</span></div>
        <div id="preflightErrors" class="log-list"></div>
      </div>

      <div class="panel">
        <h3>Timeline Scrubber</h3>
        <input id="rngTimeline" type="range" min="0" max="5" step="0.033" value="0" disabled />
        <div class="meta-row">
          <span id="lblTime">0.00s / 0.00s</span>
          <span id="lblSeekMode">-</span>
        </div>
      </div>

      <div class="panel">
        <h3>Render Output</h3>
        <div id="lblRenderStatus">Idle</div>
      </div>

      <div class="panel">
        <h3>Runtime Security Log</h3>
        <div id="securityLog" class="log-list"></div>
      </div>
    </aside>

    <section id="viewportHost">
      Isolated Preview Viewport (WebContentsView mounts here)
    </section>
  </main>

  <script type="module" src="../../dist/renderer/studioApp.js"></script>
</body>
</html>
